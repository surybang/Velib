[project]
name = "velib-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "surybang", email = "hos.fabien@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "folium>=0.20.0",
    "httpx>=0.28.1",
    "plotly>=7.0.0",
    "streamlit>=1.63.0",
    "streamlit-folium>=0.27.4",
]

[project.scripts]
velib-dashboard = "velib_dashboard:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
