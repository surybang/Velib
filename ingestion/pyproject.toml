[project]
name = "velib-ingestion"
version = "0.1.0"
description = "Collecte Vélib + météo vers PostgreSQL bronze"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
ingest-velib = "velib_ingestion.entrypoints.velib:main"
ingest-meteo = "velib_ingestion.entrypoints.meteo:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "velib_ingestion"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.23.1",
    "ruff>=0.16.2",
]
