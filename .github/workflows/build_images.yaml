name: build-images

on:
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - "dbt/**"
      - "app/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: ingestion
            image: velib-ingestion
          - context: dbt
            image: velib-dbt
          - context: app/velib_api
            image: velib-api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/surybang/${{ matrix.image }}:latest
            ghcr.io/surybang/${{ matrix.image }}:${{ github.sha }}
