name: smoke-test-api

# Vérifie que l'image API démarre et répond, avec un PostgreSQL jetable.
# Ne teste pas le bout-en-bout avec les vraies données (base Onyxia
# inaccessible depuis la CI), seulement que le conteneur est valide.

on:
  push:
    branches: [main]
    paths: ["app/velib_api/**"]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: velib
          POSTGRES_PASSWORD: velib
          POSTGRES_DB: velib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: 🗄️ Créer le schéma gold minimal
        run: |
          PGPASSWORD=velib psql -h localhost -U velib -d velib_test <<'SQL'
          CREATE SCHEMA IF NOT EXISTS gold;
          CREATE TABLE gold.fct_velib_meteo (
              stationcode text,
              station_name text,
              commune text,
              lat double precision,
              lon double precision,
              capacity int,
              bikes_available int,
              docks_available int,
              mechanical int,
              ebike int,
              occupancy_rate numeric,
              is_empty boolean,
              is_full boolean,
              temperature_2m numeric,
              precipitation numeric,
              wind_speed_10m numeric,
              duedate timestamptz,
              ingested_at timestamptz
          );
          SQL

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./app/velib_api
          load: true
          tags: velib-api:test

      - name: 🚀 Démarrer le conteneur
        run: |
          docker run -d --name velib-api \
            --network host \
            -e PGHOST=localhost \
            -e PGPORT=5432 \
            -e PGDATABASE=velib_test \
            -e PGUSER=velib \
            -e PGPASSWORD=velib \
            velib-api:test

      - name: ⏳ Attendre que l'API réponde
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/v1/health; then
              echo ""
              echo "L'API répond !"
              exit 0
            fi
            echo "Tentative $i : l'API ne répond pas encore..."
            sleep 2
          done
          echo "Tout est chaos"
          docker logs velib-api
          exit 1

      - name: 🔎 Vérifier un endpoint de données
        run: |
          curl -sf http://localhost:8000/v1/city/stats || {
            echo "L'endpoint city/stats a échoué"
            docker logs velib-api
            exit 1
          }
          echo ""
          echo "Endpoint de données OK"

      - name: 🧹 Nettoyage
        if: always()
        run: docker rm -f velib-api
